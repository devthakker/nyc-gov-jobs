services:
  postgres:
    image: postgres:16-alpine
    container_name: ula-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Chicago
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/migrations/migrate.sh"]
    volumes:
      - ./db/migrations:/migrations:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      NEWSLETTER_FROM: ${NEWSLETTER_FROM:-Job Tracks <dispatch@jobtracks.local>}
      SITE_URL: ${SITE_URL:-http://localhost:4000}
      TZ: America/Chicago
    volumes:
      - .:/workspace

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ula-demo-api
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:4000,http://127.0.0.1:4000}
      API_STATEMENT_TIMEOUT_MS: ${API_STATEMENT_TIMEOUT_MS:-5000}
      TZ: America/Chicago
    command:
      - uvicorn
      - app.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-server-header
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    tmpfs:
      - /tmp
    volumes:
      - .:/workspace:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: development
    container_name: ula-demo-web
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_OUT_DIR: /tmp/job-tracks-web-dist
    ports:
      - "127.0.0.1:${WEB_PORT:-4000}:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) })"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    tmpfs:
      - /tmp
    volumes:
      - ./web:/app:ro
      - web-node-modules:/app/node_modules

  mailpit:
    image: axllent/mailpit:latest
    container_name: ula-demo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8025"
      - "127.0.0.1:1026:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
      TZ: America/Chicago
    volumes:
      - mailpit-data:/data

volumes:
  postgres-data:
  mailpit-data:
  web-node-modules:
