[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtracks-pilot"
version = "0.1.0"
description = "Local occupational-tracks job aggregation pilot"
requires-python = ">=3.11"
dependencies = [
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = [
  "httpx2==2.10.0",
]

[project.scripts]
jobtracks = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
